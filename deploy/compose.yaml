# Glowworm with Docker Compose (or podman-compose). From this directory:
#
#   docker compose up -d                  # Glowworm on http://localhost:8080
#   docker compose logs glowworm          # the setup link, and a QR code of it
#
# With HTTPS from Caddy, for a domain that points at this machine (ports 80
# and 443 open), put GLOWWORM_PUBLIC_URL=https://money.example.com in a .env
# file next to this one, then:
#
#   docker compose --profile caddy up -d
#
# Updating: docker compose pull && docker compose up -d
services:
  glowworm:
    image: ghcr.io/ejagombar/glowworm:latest
    # To build from this checkout instead of pulling the image:
    # build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports:
      # Only this machine. Caddy reaches Glowworm over the compose network.
      - "127.0.0.1:8080:8080"
    volumes:
      - glowworm-data:/data
    environment:
      GLOWWORM_TIMEZONE: "Europe/London"
      GLOWWORM_PUBLIC_URL: "${GLOWWORM_PUBLIC_URL:-}"
      # Caddy's address on the compose network, for the visitor's own IP.
      GLOWWORM_TRUSTED_PROXIES: "172.16.0.0/12"
      # GLOWWORM_SETUP_TOKEN: "print-a-secret-here"   # made and logged if unset

  caddy:
    image: docker.io/library/caddy:2
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      GLOWWORM_PUBLIC_URL: "${GLOWWORM_PUBLIC_URL:-}"
      GLOWWORM_UPSTREAM: "glowworm:8080"

volumes:
  glowworm-data: {}
  caddy-data: {}
  caddy-config: {}
