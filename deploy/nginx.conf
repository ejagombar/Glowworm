# /etc/nginx/conf.d/glowworm.eagombar.uk.conf
# Install this as plain HTTP, then run `sudo certbot --nginx -d glowworm.eagombar.uk`:
# certbot adds the HTTPS listener, certificate and HTTP redirect to this file.
# HTTP/2 is already on for every site on port 443 (set on the shared listener).

server {
    server_name glowworm.eagombar.uk;

    client_max_body_size 25m;   # statement uploads (match GLOWWORM_UPLOAD_MAX_MB)

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI calls can be slow (schema detection)
        proxy_buffering off;       # required for the NDJSON chat and SSE import streams
        proxy_cache off;
    }

    listen 80;
    listen [::]:80;
}
