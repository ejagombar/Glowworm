name: Release and deploy

# Pushing a version tag on main (v1.2, v1.2.3, …) checks the code, then:
#   release: builds Glowworm for Linux, macOS and Windows, publishes a GitHub
#            release with the binaries and their checksums, and deploys the
#            linux/arm64 one to the server (setup: deploy/README.md);
#   image:   builds the container image for amd64 and arm64 and pushes it to
#            ghcr.io/<owner>/glowworm as the version and latest.
#
# Secrets (the same ones the website repo uses):
#   DEPLOY_KEY   private SSH key the server accepts
#   SERVER_USER  the user Glowworm runs as on the server
# Optional variable: SERVER_HOST (default eagombar.uk)

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Tag a commit that has been merged to main."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          golangci-lint run ./...

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The names are what `glowworm update`, install.sh and deploy.sh
      # download: glowworm-<os>-<arch>[.exe]. Keep glowworm-linux-arm64.
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/glowworm-$os-$arch$ext" ./cmd/glowworm
          done
          (cd dist && sha256sum glowworm-* > checksums.txt)
          # releases/latest/download/install.sh is the one-line install.
          cp deploy/install.sh dist/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy
        env:
          SSH: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new
          TARGET: ${{ secrets.SERVER_USER }}@${{ vars.SERVER_HOST || 'eagombar.uk' }}
        run: |
          rsync -avz -e "$SSH" dist/glowworm-linux-arm64 deploy/deploy.sh deploy/backup.sh "$TARGET:glowworm-deploy/"
          $SSH "$TARGET" "bash ~/glowworm-deploy/deploy.sh '$TAG'"

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/glowworm
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      # The Dockerfile cross-compiles, so both platforms build natively.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
