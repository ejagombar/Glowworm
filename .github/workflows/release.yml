name: Release and deploy

# Pushing a version tag on main (v1.2, v1.2.3, …) builds Glowworm for the
# arm64 server, publishes a GitHub release with the binary, and deploys it.
# Setup on the server: deploy/README.md.
#
# Secrets (the same ones the website repo uses):
#   DEPLOY_KEY   private SSH key the server accepts
#   SERVER_USER  the user Glowworm runs as on the server
# Optional variable: SERVER_HOST (default eagombar.uk)

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write # to publish the release

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      HOST: ${{ vars.SERVER_HOST || 'eagombar.uk' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Tag a commit that has been merged to main."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          golangci-lint run ./...

      - name: Build for linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=$TAG" \
            -o glowworm-linux-arm64 ./cmd/glowworm

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" glowworm-linux-arm64 --title "$TAG" --generate-notes --verify-tag

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy
        env:
          SSH: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new
          TARGET: ${{ secrets.SERVER_USER }}@${{ vars.SERVER_HOST || 'eagombar.uk' }}
        run: |
          rsync -avz -e "$SSH" glowworm-linux-arm64 deploy/deploy.sh deploy/backup.sh "$TARGET:glowworm-deploy/"
          $SSH "$TARGET" "bash ~/glowworm-deploy/deploy.sh '$TAG'"
