# Glowworm configuration — env vars take precedence.
# Copy to glowworm.toml or /etc/glowworm/glowworm.toml.

addr = "127.0.0.1:8080"
data_dir = "./data"
# db_dsn = "/var/lib/glowworm/glowworm.db"   # absolute path; default is data_dir/glowworm.db
timezone = "Europe/London"
# secret_key = "64 hex chars — auto-generated into data/secret.key when unset"
auth_mode = "password"   # password | none (none: trusted networks only)
log_format = "text"      # text | json
log_level = "info"
upload_max_mb = 25
# Foreign-currency rows in imports are converted with the ECB's daily rates
# (fetched from api.frankfurter.dev; only currency codes and dates are sent).
# "off" means you type rates in yourself.
# exchange_rates = "ecb"
# trusted_proxies = "127.0.0.1"  # behind NGINX
# The address you open Glowworm at; the setup link and its QR code use it.
# public_url = "https://money.example.com"
# Until the account exists, the setup page needs a token. By default one is
# made and the whole link printed at startup; `glowworm setup-url` prints it
# again. Set your own, or "off" for none.
# setup_token = "..."
# Create the account at startup instead of in the browser (only when none
# exists; remove the password afterwards). `glowworm user create` also works.
# owner_username = "emma"
# owner_password = "at least 10 characters"
