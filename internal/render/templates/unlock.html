{{define "content"}}
<div class="login-shell">
    <div class="login-card unlock-card">
        <div class="brand">
            <svg class="gw" viewBox="0 0 40 32" aria-hidden="true"><use href="#i-glowworm" /></svg>
            <span class="brand-name">Glowworm</span>
        </div>
        <h1 class="login-title">Glowworm is locked</h1>
        <p class="login-sub muted" id="unlockStatus" aria-live="polite">Unlock with Face ID to carry on.</p>
        {{if .Error}}<p class="login-error">{{.Error}}</p>{{end}}
        <button class="btn btn-primary" id="unlockFaceID" type="button" style="width:100%">Unlock with Face ID</button>
        <form method="post" action="/unlock/password" class="unlock-password" id="unlockPasswordForm"{{if not .Error}} hidden{{end}}>
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
            <input type="hidden" name="next" value="{{.Next}}" />
            <input type="text" name="username" value="{{.UserName}}" autocomplete="username" hidden />
            <input class="field" type="password" id="unlockPassword" name="password" placeholder="Password"
                autocomplete="current-password" required />
            <button class="btn btn-ghost" type="submit" style="width:100%">Unlock with password</button>
        </form>
        <div class="unlock-links">
            <button class="btn btn-ghost btn-xs" id="unlockUsePassword" type="button"{{if .Error}} hidden{{end}}>Use password</button>
            <form method="post" action="/logout">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
                <button class="btn btn-ghost btn-xs" type="submit">Sign out</button>
            </form>
        </div>
    </div>
</div>
<script>window.__UNLOCK_NEXT__ = {{.Next}};</script>
{{end}}
