{{define "content"}}
<section class="view active" id="view-import">
  <div class="import-idle">
    <div class="dropzone" id="dropzone">
      <svg class="icon big"><use href="#i-import"/></svg>
      <p><strong>Drop a statement here</strong> or <button class="link" id="dropzoneBrowse">browse files</button></p>
      <p class="muted">CSV, Excel, OFX or QIF</p>
      <input type="file" id="fileInput" hidden multiple />
    </div>

  </div>
  <script nonce="{{$.Nonce}}">
    window.__IMPORT_CURRENCY__ = "{{.Currency}}";
    window.__IMPORT_ACCOUNTS__ = [{{range .Accounts}}{id: "{{.ID}}", name: "{{.Name}}", color: "{{.Color}}"},{{end}}];
    window.__IMPORT_CATS__ = [{{range .Categories}}{id: "{{.ID}}", name: "{{.Name}}", type: "{{.Type}}", color: "{{.Color}}"},{{end}}];
  </script>

  <div id="importFlow" hidden></div>

</section>
{{end}}
