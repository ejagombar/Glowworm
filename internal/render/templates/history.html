{{define "content"}}
<section class="view active" id="view-history">
  <div class="view-head">
    <div>
      <h1>History</h1>
      <p class="sub">Travel through transactions or your audit log.</p>
    </div>
  </div>

  <div class="segmented history-mode" role="tablist" aria-label="History view">
    <a class="segmented-item{{if ne .Mode "audit"}} active{{end}}" href="/history?mode=transactions&period={{.Period}}" data-history-mode="transactions" role="tab" aria-selected="{{if ne .Mode "audit"}}true{{else}}false{{end}}">
      <svg class="icon"><use href="#i-transactions"/></svg> Transactions
    </a>
    <a class="segmented-item{{if eq .Mode "audit"}} active{{end}}" href="/history?mode=audit&period={{.Period}}" data-history-mode="audit" role="tab" aria-selected="{{if eq .Mode "audit"}}true{{else}}false{{end}}">
      <svg class="icon"><use href="#i-history"/></svg> Audit log
    </a>
  </div>

  <div id="historyPaneHost">{{template "history-pane-content" .}}</div>
</section>
{{end}}
