{{define "content"}}
<section class="view active" id="view-history">
  {{template "history-timeline" .}}

  <section class="history-audit" id="audit">
    <div class="section-head">
      <h2>Audit log</h2>
      <div class="section-head-actions history-filter">
        <a class="chip{{if eq .AuditFilter "all"}} active{{end}}" href="/history?filter=all#audit">All</a>
        <a class="chip{{if eq .AuditFilter "you"}} active{{end}}" href="/history?filter=you#audit">You</a>
        <a class="chip{{if eq .AuditFilter "system"}} active{{end}}" href="/history?filter=system#audit">System</a>
      </div>
    </div>
    <div id="historyPaneHost">{{template "history-audit" .}}</div>
  </section>

  <div class="history-confirm" id="historyConfirm" role="dialog" aria-labelledby="historyConfirmTitle" hidden>
    <svg class="icon history-confirm-icon" aria-hidden="true"><use href="#i-undo"/></svg>
    <div class="history-confirm-text">
      <strong id="historyConfirmTitle"></strong>
      <span id="historyConfirmDetail"></span>
    </div>
    <button class="btn btn-ghost btn-xs" type="button" id="historyConfirmCancel">Cancel</button>
    <button class="btn btn-primary btn-xs" type="button" id="historyConfirmOk"></button>
  </div>

  <div class="modal-backdrop" id="importEditModal" hidden>
    <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="importEditTitle">
      <button class="icon-btn modal-close" type="button" data-close-import-edit aria-label="Close">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
      <div class="modal-head">
        <div class="modal-head-text">
          <h3 id="importEditTitle">Edit import</h3>
          <p class="muted" id="importEditSub"></p>
        </div>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <label for="importEditAccount">Account</label>
          <select class="field select" id="importEditAccount">
            {{range .ImportAccounts}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
          </select>
        </div>
        <p class="muted">Moves this import's transactions to the chosen account. Any you've moved by hand since stay where they are. You can undo this from the audit log.</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" type="button" data-close-import-edit>Cancel</button>
        <span class="spacer"></span>
        <button class="btn btn-primary" type="button" id="importEditSave">Save</button>
      </div>
    </div>
  </div>
</section>
{{end}}
