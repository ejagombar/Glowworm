{{define "tx-modal"}}
<div class="modal-backdrop" id="txModal" hidden>
  <div class="modal account-modal" role="dialog" aria-modal="true" aria-labelledby="txModalTitle">
    <button class="icon-btn modal-close" data-action="close-tx-modal" aria-label="Close">
      <svg class="icon"><use href="#i-close"/></svg>
    </button>
    <div class="modal-head">
      <div class="modal-head-text">
        <h3 id="txModalTitle">Add transaction</h3>
        <p class="muted">Add a transaction manually. The type is worked out from the category.</p>
      </div>
    </div>
    <form class="modal-body" id="txAddForm">
      <div class="field-row">
        <label>Account</label>
        <select class="field select" id="txAccount">
          {{range .Accounts}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
        </select>
      </div>
      <div class="segmented tx-direction" role="radiogroup" aria-label="Direction">
        <button type="button" class="segmented-item active" role="radio" aria-checked="true" data-tx-direction="out">Outgoing</button>
        <button type="button" class="segmented-item" role="radio" aria-checked="false" data-tx-direction="in">Income</button>
      </div>
      <div class="field-cols">
        <div class="field-row">
          <label>Date</label>
          <input class="field" id="txDate" type="date" value="{{.Today}}" />
        </div>
        <div class="field-row">
          <label>Amount</label>
          <div class="field-unit">
            <span class="field-unit-symbol">{{.Symbol}}</span>
            <input class="field" id="txAmount" type="number" step="0.01" min="0" placeholder="{{.Symbol}}7.80" />
          </div>
        </div>
      </div>
      <div class="field-row">
        <label>Description</label>
        <input class="field" id="txDesc" type="text" placeholder="e.g. Tesco Express" />
      </div>
      <div class="field-row">
        <label>Category</label>
        <select class="field select" id="txCategory">
          <option value="">Uncategorised</option>
          {{range .Categories}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-action="close-tx-modal">Cancel</button>
        <button class="btn btn-primary" type="submit" id="txModalSave">Add transaction</button>
      </div>
    </form>
  </div>
</div>
{{end}}
