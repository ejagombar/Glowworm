{{define "content"}}
<div class="login-shell">
    <div class="login-card">
        <div class="brand">
            <svg class="gw" viewBox="0 0 40 32" aria-hidden="true"><use href="#i-glowworm"/></svg>
            <span class="brand-name">Glowworm</span>
        </div>
        <h1 class="login-title">Create your account</h1>
        <p class="muted login-sub">This is the only account on this Glowworm. Pick a strong password if it's reachable from the internet.</p>
        {{if .Error}}<p class="login-error">{{.Error}}</p>{{end}}
        <form method="post" action="/setup{{if .Token}}?token={{.Token}}{{end}}">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
            <input class="field" type="text" name="username" placeholder="Username" value="{{.Username}}"
                autocomplete="username" minlength="2" maxlength="40" required autofocus />
            <input class="field" type="password" name="password" placeholder="Password (at least 10 characters)"
                autocomplete="new-password" minlength="10" required />
            <input class="field" type="password" name="password_confirm" placeholder="Confirm password"
                autocomplete="new-password" minlength="10" required />
            <button class="btn btn-primary" type="submit" style="width:100%">Create account</button>
        </form>
    </div>
</div>
{{end}}
